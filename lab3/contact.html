<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Product Enquiry</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
            background: white;
            display: flex;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .left {
            width: 40%;
            background-color: #1e3a8a;
            color: white;
            padding: 40px;
        }

        .left h1 {
            margin-bottom: 20px;
        }

        .left p {
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .contact-info {
            margin-top: 25px;
        }

        .contact-info p {
            margin-bottom: 15px;
        }

        .right {
            width: 60%;
            padding: 40px;
        }

        .right h2 {
            margin-bottom: 25px;
            color: #222;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #1e3a8a;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #162d6b;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .left, .right {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Left Section -->
        <div class="left">
            <h1>Contact Us</h1>

            <p>
                Have questions about our products?
                Fill out the enquiry form and our team
                will get back to you soon.
            </p>

            <div class="contact-info">
                <p>📧 Email: support@example.com</p>
                <p>📞 Phone: +91 98765 43210</p>
                <p>📍 Location: New Delhi, India</p>
            </div>
        </div>

        <!-- Right Section -->
        <div class="right">
            <h2>Product Enquiry</h2>

            <form>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name"
                           placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"
                           placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label for="product">Select Product</label>
                    <select id="product">
                        <option value="">-- Select Product --</option>
                        <option>Product 1</option>
                        <option>Product 2</option>
                        <option>Product 3</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Enquiry</label>
                    <textarea id="message"
                              placeholder="Write your product enquiry here..."
                              required></textarea>
                </div>

                <button type="submit">Submit Enquiry</button>

            </form>
        </div>

    </div>

</body>
</html>
